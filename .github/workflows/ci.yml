name: CI

on:
  push:
  pull_request:

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute notebook
        run: python -m jupyter nbconvert --to notebook --execute --output /tmp/executed.ipynb Vaccine_response_simulation.ipynb
